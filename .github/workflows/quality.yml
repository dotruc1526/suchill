name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          install-dependencies: true
      - run: npm ci
      - run: npm run quality
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
