# Standalone PvP trial: frontend and backend together, no Firebase/main changes.
services:
  - type: web
    name: suchill-dautri-pvp
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile.pvp-trial
    dockerContext: .
    healthCheckPath: /health
    numInstances: 1
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
